<script>
  (function() {
    const state = {
      access: window.CSR_DASHBOARD_INITIAL_STATE.access || {},
      refreshIntervalMs: window.CSR_DASHBOARD_INITIAL_STATE.refreshIntervalMs,
      logoUrl: window.CSR_DASHBOARD_INITIAL_STATE.logoUrl,
      printUrl: window.CSR_DASHBOARD_INITIAL_STATE.printUrl,
      data: null,
      activeCompetitionTab: 'Conversions',
      refreshTimer: null,
      competitionRotationTimer: null,
      competitionRotationIntervalMs: 60000,
      cachedCompetitions: null,
      loading: false,
      loadingStartedAt: 0,
      loadingTicker: null,
      loadingEstimateMs: 0,
      loadingCountdownMs: 0,
      isPrintMode: Boolean(window.CSR_DASHBOARD_PRINT_MODE),
      isPrintModalOpen: false,
      autoScrollHandles: Object.create(null),
    };

    const root = document.getElementById(state.isPrintMode ? 'print-app' : 'app');
    window.CSRDashboardHandleEmployeeImageError = function(image) {
      if (!image || image.dataset.fallbackApplied === 'true') {
        return;
      }

      const fileId = extractDriveFileId(image.src);
      if (!fileId) {
        return;
      }

      image.dataset.fallbackApplied = 'true';
      image.src = 'https://drive.google.com/uc?export=view&id=' + fileId;
    };

    function extractDriveFileId(url) {
      const match = String(url || '').match(/[?&]id=([a-zA-Z0-9_-]+)/i);
      return match ? match[1] : '';
    }


    function boot() {
      bindGlobalEvents();
      fetchDashboardData();
      scheduleRefresh();
      scheduleCompetitionRotation();
    }

    function scheduleRefresh() {
      clearInterval(state.refreshTimer);
      state.refreshTimer = setInterval(function() {
        fetchDashboardData(true);
      }, state.refreshIntervalMs || 60000);
    }

    function fetchDashboardData(isRefresh) {
      state.loading = true;
      if (!isRefresh || !state.data) {
        startLoading(isRefresh ? 'Refreshing dashboard' : 'Loading dashboard');
      }
      google.script.run
        .withSuccessHandler(function(payload) {
          stopLoading();
          state.data = payload;
          state.cachedCompetitions = payload.competitions;
          if (!payload.competitions.categories[state.activeCompetitionTab]) {
            state.activeCompetitionTab = payload.competitions.tabs[0];
          }
          render(isRefresh);
        })
        .withFailureHandler(function(error) {
          stopLoading();
          if (state.data) {
            render(isRefresh);
            return;
          }
          renderError(error && error.message ? error.message : 'Unable to load dashboard data.');
        })
        [isRefresh ? 'refreshDashboardData' : 'getInitialDashboardData']();
    }

    function updateTask(taskName, nextCompleted, assignedCsr) {
      google.script.run
        .withSuccessHandler(function(tasksPayload) {
          state.data.tasks = tasksPayload;
          updateTasksPanel(taskName);
        })
        .withFailureHandler(function(error) {
          renderError(error && error.message ? error.message : 'Unable to update task.');
        })
        .updateTaskStatus(taskName, nextCompleted, assignedCsr);
    }

    function scheduleCompetitionRotation() {
      clearInterval(state.competitionRotationTimer);
      state.competitionRotationTimer = setInterval(function() {
        rotateCompetitionTab();
      }, state.competitionRotationIntervalMs);
    }

    function rotateCompetitionTab() {
      const competitions = state.cachedCompetitions || (state.data && state.data.competitions);
      if (!competitions || !competitions.tabs || competitions.tabs.length < 2) {
        return;
      }

      const currentIndex = Math.max(competitions.tabs.indexOf(state.activeCompetitionTab), 0);
      state.activeCompetitionTab = competitions.tabs[(currentIndex + 1) % competitions.tabs.length];
      updateCompetitionModule(true);
    }

    function render(isRefresh, changedTaskName) {
      if (state.isPrintMode) {
        renderPrint();
        return;
      }

      if (!root.querySelector('.dashboard')) {
        renderDashboardShell();
      }

      updateHeroPanel();
      updatePerformancePanel();
      updateTasksPanel(changedTaskName);
      updateSchedulePanel();
      updateCompetitionPanel();
      updateEmployeePanel();
      updatePrintModal();

      if (isRefresh) {
        pulseMetrics();
      }
    }

    function renderDashboardShell() {
      root.innerHTML = `
        <main class="dashboard">
          <section class="panel hero-panel" data-panel="hero"></section>
          <section class="panel performance-panel" data-panel="performance"></section>
          <section class="panel schedule-panel" data-panel="schedule"></section>
          <section class="panel tasks-panel" data-panel="tasks"></section>
          <section class="panel competition-panel" data-panel="competition"></section>
          <section class="panel employee-panel" data-panel="employee"></section>
        </main>
        <div class="print-modal-layer" data-print-modal-layer></div>
      `;
    }

    function updateHeroPanel() {
      const panel = root.querySelector('[data-panel="hero"]');
      if (!panel) {
        return;
      }
      panel.innerHTML = renderHero();
      bindInfiniteTicker(panel.querySelector('[data-autoscroll="stores"]'), { speedPxPerSecond: 28 });
    }

    function updatePerformancePanel() {
      const panel = root.querySelector('[data-panel="performance"]');
      if (!panel) {
        return;
      }
      panel.innerHTML = renderPerformance();
      bindInfiniteTicker(panel.querySelector('[data-autoscroll="performance"]'), { speedPxPerSecond: 34 });
    }

    function updateTasksPanel(changedTaskName) {
      const panel = root.querySelector('[data-panel="tasks"]');
      if (!panel) {
        return;
      }
      panel.innerHTML = renderTasks(changedTaskName);
      bindTaskEvents(panel);
      fitTasksPanel(panel);
      bindInfiniteTicker(panel.querySelector('[data-autoscroll="tasks"]'), { speedPxPerSecond: 30 });
    }

    function updateSchedulePanel() {
      const panel = root.querySelector('[data-panel="schedule"]');
      if (!panel) {
        return;
      }
      panel.innerHTML = renderScheduleModule();
    }

    function updateCompetitionPanel() {
      const panel = root.querySelector('[data-panel="competition"]');
      if (!panel) {
        return;
      }
      panel.innerHTML = renderCompetitionModule();
      bindCompetitionEvents(panel);
      bindInfiniteTicker(panel.querySelector('[data-autoscroll="competition"]'), { speedPxPerSecond: 30 });
    }

    function updateEmployeePanel() {
      const panel = root.querySelector('[data-panel="employee"]');
      if (!panel) {
        return;
      }
      panel.innerHTML = renderEmployeeModule();
    }

    function updateCompetitionModule(animate) {
      const shell = root.querySelector('[data-panel="competition"]');
      if (!shell) {
        updateCompetitionPanel();
        return;
      }

      shell.innerHTML = renderCompetitionModule();
      if (animate) {
        shell.classList.remove('competition-module-animate');
        window.requestAnimationFrame(function() {
          shell.classList.add('competition-module-animate');
        });
      }
      bindCompetitionEvents(shell);
      bindInfiniteTicker(shell.querySelector('[data-autoscroll="competition"]'), { speedPxPerSecond: 30 });
    }

    function renderHero() {
      const hero = state.data.hero;
      const deltaClass = hero.deltaPercent >= 0 ? 'delta-positive' : 'delta-negative';
      return `
          <div>
            <div class="brand-lockup">
              <img class="brand-logo" src="${escapeHtml(state.logoUrl)}" alt="Dublin Cleaners logo">
              <div>
                <div class="eyebrow">Operations Overview</div>
                <h1 class="brand-title">Dublin Cleaners<br>CSR Dashboard</h1>
                <p class="brand-copy">A high-clarity operations board for sales momentum, CSR productivity, and live front-of-house task execution.</p>
              </div>
            </div>
            <div class="hero-grid">
              <div class="metric-block">
                <div class="metric-label">${escapeHtml(hero.weekLabel)} sales</div>
                <div class="metric-value">${formatCurrency(hero.currentYearSales)}</div>
                <div class="metric-subtle">Current year</div>
              </div>
              <div class="metric-block">
                <div class="metric-label">Last year</div>
                <div class="metric-value">${formatCurrency(hero.lastYearSales)}</div>
                <div class="metric-subtle">Same week comparison</div>
              </div>
              <div class="metric-block">
                <div class="metric-label">Year-over-year</div>
                <div class="metric-value ${deltaClass}">${formatPercent(hero.deltaPercent)}</div>
                <div class="metric-subtle">Chain-wide performance delta</div>
              </div>
            </div>
          </div>
          <div class="hero-side">
            <div>
              <div class="section-head">
                <div>
                  <h2 class="section-title">Store comparison</h2>
                  <div class="section-copy">Last week sales stacked against the same week last year.</div>
                </div>
                <span class="refresh-chip">Auto refresh every 60 sec</span>
              </div>
              <div class="store-list-viewport" data-autoscroll="stores">
                <div class="store-list">
                ${hero.stores.map(function(store) {
                  return `
                    <div class="store-row">
                      <strong>${escapeHtml(store.store)}</strong>
                      <span>${formatCurrency(store.currentYear)}</span>
                      <span>${formatCurrency(store.lastYear)}</span>
                      <span class="${store.deltaPercent >= 0 ? 'delta-positive' : 'delta-negative'}">${formatPercent(store.deltaPercent)}</span>
                    </div>
                  `;
                }).join('')}
                </div>
              </div>
            </div>
            <div class="hero-actions">
              <a class="sheet-chip" href="${escapeHtml(state.data.spreadsheetUrl)}" target="_blank" rel="noopener noreferrer" title="Google may prompt for sign-in and will only open the sheet for accounts the owner has permissioned.">Open source sheet</a>
              <button class="sheet-chip print-action" type="button" data-open-print-modal>Open print view</button>

      `;
    }

    function renderPerformance() {
      const performance = state.data.performance;
      const topValue = performance.entries[0] ? performance.entries[0].dollarsPerHour : 0;

      return `
          <div class="section-head">
            <div>
              <h2 class="section-title">CSR Performance</h2>
              <div class="section-copy">Last week’s $/hour by CSR, ranked highest to lowest for quick coaching focus.</div>
            </div>
            <span class="refresh-chip">${escapeHtml(performance.dateLabel)}</span>
          </div>
          <div class="performance-list-viewport" data-autoscroll="performance">
            <div class="performance-list">
            ${performance.entries.map(function(entry) {
              const fill = topValue ? Math.round((entry.dollarsPerHour / topValue) * 100) : 0;
              return `
                <div class="performance-row">
                  <span class="rank-badge ${escapeHtml(entry.tier)}">#${entry.rank}</span>
                  <div class="performance-meta">
                    <strong>${escapeHtml(entry.csr)}</strong>
                    <div class="performance-bar" style="--fill:${fill}%"></div>
                  </div>
                  <span>${formatCurrency(entry.sales)}</span>
                  <strong>${formatCurrency(entry.dollarsPerHour)}/hr</strong>
                </div>
              `;
            }).join('') || '<div class="subtle-empty">Add rows to the CSR_Performance sheet for last week to populate this ranking.</div>'}
            </div>
          </div>
      `;
    }

    function renderTasks(changedTaskName) {
      const tasks = state.data.tasks;
      return `
          <div class="section-head">
            <div>
              <h2 class="section-title">Today’s Tasks</h2>
              <div class="section-copy">Primary focus area. Assign owners in Sheets, then confirm completion directly on the dashboard.</div>
            </div>
            <span class="refresh-chip">${tasks.summary.progressPercent}% complete</span>
          </div>
          <div class="tasks-summary">
            <div class="summary-grid">
              <div>
                <div class="summary-label">Complete</div>
                <div class="summary-value">${tasks.summary.completed}</div>
              </div>
              <div>
                <div class="summary-label">Unassigned</div>
                <div class="summary-value">${tasks.summary.unassigned}</div>
              </div>
              <div>
                <div class="summary-label">Total</div>
                <div class="summary-value">${tasks.summary.total}</div>
              </div>
            </div>
            <div class="summary-bar"><span style="--fill:${tasks.summary.progressPercent}%"></span></div>
          </div>
          <div class="task-list-viewport" data-autoscroll="tasks">
            <div class="task-list">
              ${tasks.entries.map(function(entry) {
                const changedClass = changedTaskName === entry.task ? 'changed' : '';
                return `
                  <div class="task-row ${entry.completed ? 'completed' : ''} ${changedClass}">
                    <div class="task-primary">
                      <div class="task-name">${escapeHtml(entry.task)}</div>
                      <div class="task-meta">${entry.updatedAt ? 'Updated ' + escapeHtml(entry.updatedAt) : 'Awaiting completion update'}</div>
                    </div>
                    <div class="task-assignment">
                      <div class="task-meta">Assigned CSR</div>
                      <div>${escapeHtml(entry.assignedCsr || 'Unassigned')}</div>
                    </div>
                    <div class="task-status">
                      <button class="status-pill ${entry.completed ? 'complete' : 'pending'}" data-task="${escapeAttribute(entry.task)}" data-assignee="${escapeAttribute(entry.assignedCsr || '')}" data-completed="${String(entry.completed)}">
                        ${entry.completed ? 'Completed' : 'Mark done'}
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
      `;
    }

    function renderScheduleModule() {
      const schedule = state.data.schedule;
      const days = Array.isArray(schedule.days) ? schedule.days : [];

      return `
        <div class="section-head">
          <div>
            <h2 class="section-title">Schedule Snapshot</h2>
            <div class="section-copy">Who is off across all scheduled dates from the sheet.</div>
          </div>
        </div>
        <div class="schedule-days schedule-days-viewport">
          ${days.length
            ? days.map(function(day) {
              return renderScheduleDay(day.label, day.off);
            }).join('')
            : '<div class="subtle-empty">No OFF schedule entries were found.</div>'}
        </div>
      `;
    }

    function renderCompetitionModule() {
      const competitions = state.cachedCompetitions || state.data.competitions;
      const activeRows = competitions.categories[state.activeCompetitionTab] || [];

      return `
        <div class="section-head competition-head">
          <div>
            <h2 class="section-title">Competition Module</h2>
            <div class="section-copy">🚧 Under Contstruction — Sheet-driven tabs for key add-on contests and conversion pushes.</div>
          </div>
          <span class="refresh-chip">Rotates every 60 sec</span>
        </div>
        <div class="tabs competition-tabs" role="tablist" aria-label="Competition categories">
          ${competitions.tabs.map(function(tab) {
            return `<button class="tab-chip competition-tab-chip competition-tab-${slugify(tab)} ${tab === state.activeCompetitionTab ? 'active' : ''}" data-tab="${escapeAttribute(tab)}" aria-pressed="${String(tab === state.activeCompetitionTab)}">${escapeHtml(tab)}</button>`;
          }).join('')}
        </div>
        <div class="competition-list-viewport" data-autoscroll="competition">
          <div class="competition-list">
          ${activeRows.map(function(entry) {
            return `
              <div class="competition-row">
                <div class="competition-meta">
                  <strong>${escapeHtml(entry.csr)}</strong>
                  <div class="competition-bar" style="--fill:${entry.progressPercent}%"></div>
                  <div class="task-meta">${escapeHtml(entry.notes || 'No note')}</div>
                </div>
                <strong>${entry.value}/${entry.goal}</strong>
              </div>
            `;
          }).join('') || '<div class="subtle-empty">Add competition rows to the Competitions sheet for this tab.</div>'}
          </div>
        </div>
      `;
    }

    function renderEmployeeModule() {
      const employee = state.data.employeeOfWeek;
      const imageHtml = employee.imageUrl
        ? `
          <div class="employee-image-wrap">
            <img class="employee-avatar" src="${escapeHtml(employee.imageUrl)}" alt="${escapeAttribute(employee.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="window.CSRDashboardHandleEmployeeImageError(this)">
          </div>
        `
        : `<div class="employee-avatar employee-fallback">${escapeHtml((employee.name || 'E').charAt(0).toUpperCase())}</div>`;

      return `
        <div class="section-head">
          <div>
            <h2 class="section-title">Employee of the Week</h2>
            <div class="section-copy">Recognition block with a daily service quote delivered by API.</div>
          </div>
        </div>
        <div class="employee-layout">
          <div class="employee-copy">
            <h3 class="employee-name">${escapeHtml(employee.name)}</h3>
            <p class="employee-quote">“${escapeHtml(employee.quote)}”</p>
            ${(employee.quoteAuthor || employee.quoteSource) ? `
              <div class="employee-quote-meta">
                ${employee.quoteAuthor ? `<span>— ${escapeHtml(employee.quoteAuthor)}</span>` : ''}
                ${employee.quoteSource ? `<span>${employee.quoteAuthor ? ' · ' : ''}Daily quote via ${employee.quoteSourceUrl ? `<a href="${escapeAttribute(employee.quoteSourceUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(employee.quoteSource)}</a>` : escapeHtml(employee.quoteSource)}</span>` : ''}
              </div>
            ` : ''}
            ${employee.highlight ? `<span class="employee-highlight">${escapeHtml(employee.highlight)}</span>` : ''}
          </div>
          ${imageHtml}
        </div>
      `;
    }

    function renderScheduleDay(label, items) {
      return `
        <div>
          <div class="task-meta" style="margin-bottom:8px">${escapeHtml(label)}</div>
          <div class="schedule-list">
            ${items.length ? items.map(function(item) {
              return `
                <div class="schedule-row">
                  <div>
                    <strong>${escapeHtml(item.csr)}</strong>
                    <div class="task-meta">${escapeHtml(item.notes || 'Off')}</div>
                  </div>
                  <span class="status-pill pending">OFF</span>
                </div>
              `;
            }).join('') : '<div class="subtle-empty">No team members off.</div>'}
          </div>
        </div>
      `;
    }

    function renderUnauthorized() {
      root.innerHTML = `
        <section class="unauthorized">
          <div class="unauthorized-panel">
            <img class="brand-logo" src="${escapeHtml(state.logoUrl)}" alt="Dublin Cleaners logo">
            <div class="eyebrow">Dublin Cleaners</div>
            <h1 class="unauthorized-title">Access changed</h1>
            <p class="unauthorized-copy">This screen is no longer used for normal dashboard entry because the dashboard now loads publicly.</p>
            <p class="tiny">Opening the source sheet still follows Google's normal sign-in and file permission checks.</p>
          </div>
        </section>
      `;
    }

    function startLoading(message) {
      state.loading = true;
      state.loadingStartedAt = Date.now();
      state.loadingEstimateMs = getLoadingEstimateMs();
      state.loadingCountdownMs = state.loadingEstimateMs;
      clearInterval(state.loadingTicker);
      renderLoading(message, state.loadingCountdownMs);
      state.loadingTicker = setInterval(function() {
        updateLoadingTimer();
      }, 250);
    }

    function stopLoading() {
      if (state.loadingStartedAt) {
        storeLoadingDuration(Date.now() - state.loadingStartedAt);
      }
      state.loading = false;
      clearInterval(state.loadingTicker);
      state.loadingTicker = null;
      state.loadingStartedAt = 0;
      state.loadingCountdownMs = 0;
    }

    function updateLoadingTimer() {
      const timerNode = root.querySelector('[data-loading-timer]');
      if (!timerNode || !state.loadingStartedAt) {
        return;
      }

      const elapsedMs = Date.now() - state.loadingStartedAt;
      const remainingMs = Math.max(1000, state.loadingEstimateMs - elapsedMs);
      state.loadingCountdownMs = remainingMs;
      timerNode.textContent = formatLoadingCountdown(remainingMs);
    }

    function renderLoading(message, remainingMs) {
      root.innerHTML = `
        <div class="loading-state">
          <div class="loading-copy">
            <div class="eyebrow">Please wait</div>
            <h1 class="section-title">${escapeHtml(message)}</h1>
            <p class="loading-timer" data-loading-timer>${formatLoadingCountdown(remainingMs)}</p>
          </div>
          <div class="loading-spinner" aria-hidden="true"></div>
        </div>
      `;
    }

    function getLoadingEstimateMs() {
      try {
        const stored = Number(window.localStorage.getItem('csrDash.avgLoadMs'));
        if (stored && isFinite(stored)) {
          return clamp(stored, 2500, 20000);
        }
      } catch (error) {
        return 6000;
      }

      return 6000;
    }

    function storeLoadingDuration(durationMs) {
      if (!durationMs || !isFinite(durationMs)) {
        return;
      }

      try {
        const previous = Number(window.localStorage.getItem('csrDash.avgLoadMs'));
        const base = previous && isFinite(previous) ? previous : durationMs;
        const weightedAverage = Math.round((base * 0.65) + (durationMs * 0.35));
        window.localStorage.setItem('csrDash.avgLoadMs', String(clamp(weightedAverage, 2500, 20000)));
      } catch (error) {
        return;
      }
    }

    function formatLoadingCountdown(remainingMs) {
      const totalSeconds = Math.max(1, Math.ceil((Number(remainingMs) || 0) / 1000));
      return 'About ' + totalSeconds + 's remaining';
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function renderError(message) {
      root.innerHTML = `
        <div class="error-state">
          <div class="unauthorized-panel">
            <div class="eyebrow">Dashboard error</div>
            <h1 class="unauthorized-title">Unable to load</h1>
            <p class="unauthorized-copy">${escapeHtml(message)}</p>
          </div>
        </div>
      `;
    }

    function renderPrint() {
      root.innerHTML = renderPrintLayout();
    }

    function renderPrintLayout() {
      const tasks = state.data.tasks.entries;
      return `
        <section class="print-layout ${state.loading ? '' : 'fade-swap'}" data-print-layout>
          <div class="print-card">
            <img class="brand-logo" src="${escapeHtml(state.logoUrl)}" alt="Dublin Cleaners logo">
            <div class="eyebrow">Printable operations view</div>
            <h1 class="print-title">CSR Dashboard Summary</h1>
            <p class="unauthorized-copy">Generated ${escapeHtml(new Date(state.data.generatedAt).toLocaleString())} from the Google Sheets data source.</p>
          </div>
          <div class="print-grid">
            <div class="print-card">
              <h2 class="section-title">Sales headline</h2>
              <p>${formatCurrency(state.data.hero.currentYearSales)} vs ${formatCurrency(state.data.hero.lastYearSales)} (${formatPercent(state.data.hero.deltaPercent)})</p>
            </div>
            <div class="print-card">
              <h2 class="section-title">Task progress</h2>
              <p>${state.data.tasks.summary.completed}/${state.data.tasks.summary.total} complete · ${state.data.tasks.summary.unassigned} unassigned</p>
            </div>
          </div>
          <div class="print-card">
            <h2 class="section-title">Today’s Tasks</h2>
            ${tasks.map(function(entry) {
              return `
                <div class="print-task">
                  <span>${escapeHtml(entry.task)} — ${escapeHtml(entry.assignedCsr || 'Unassigned')}</span>
                  <strong>${entry.completed ? 'Done' : 'Open'}</strong>
                </div>
              `;
            }).join('')}
          </div>
        </section>
      `;
    }

    function updatePrintModal() {
      const modalLayer = root.querySelector('[data-print-modal-layer]');
      if (!modalLayer) {
        return;
      }

      document.body.classList.toggle('print-modal-open', state.isPrintModalOpen);
      modalLayer.innerHTML = state.isPrintModalOpen ? renderPrintModal() : '';
      bindHeroActions(root);
      bindPrintModalEvents(modalLayer);
    }

    function renderPrintModal() {
      return `
        <div class="print-modal-backdrop" data-close-print-modal></div>
        <section class="print-modal" role="dialog" aria-modal="true" aria-labelledby="print-modal-title">
          <div class="print-modal-header">
            <div>
              <div class="eyebrow">Quick print view</div>
              <h2 class="print-title" id="print-modal-title">CSR Dashboard Summary</h2>
            </div>
            <div class="print-modal-actions no-print">
              <button class="sheet-chip print-action" type="button" data-trigger-browser-print>Print now</button>
              <button class="sheet-chip" type="button" data-close-print-modal>Close</button>
            </div>
          </div>
          ${renderPrintLayout()}
        </section>
      `;
    }

    function bindTaskEvents(scope) {
      scope.querySelectorAll('[data-task]').forEach(function(button) {
        button.addEventListener('click', function() {
          const taskName = button.getAttribute('data-task');
          const assignedCsr = button.getAttribute('data-assignee') || '';
          const completed = button.getAttribute('data-completed') === 'true';
          updateTask(taskName, !completed, assignedCsr);
        });
      });
    }

    function fitTasksPanel(panel) {
      const taskViewport = panel.querySelector('.task-list-viewport');
      const taskList = panel.querySelector('.task-list');
      if (!taskViewport || !taskList) {
        return;
      }

      const layouts = [
        { density: 'default', columns: 2 },
        { density: 'compact', columns: 2 },
        { density: 'compact', columns: 3 },
      ];

      let bestLayout = layouts[0];
      let bestScale = 0;

      layouts.forEach(function(layout) {
        panel.dataset.taskDensity = layout.density;
        panel.dataset.taskColumns = String(layout.columns);
        taskList.style.transform = 'scale(1)';

        const widthScale = taskViewport.clientWidth / Math.max(taskList.scrollWidth, 1);
        const heightScale = taskViewport.clientHeight / Math.max(taskList.scrollHeight, 1);
        const scale = Math.min(1, widthScale, heightScale);

        if (scale > bestScale) {
          bestScale = scale;
          bestLayout = layout;
        }
      });

      panel.dataset.taskDensity = bestLayout.density;
      panel.dataset.taskColumns = String(bestLayout.columns);
      taskList.style.transform = 'scale(1)';
    }

    function bindInfiniteTicker(viewport, options) {
      if (!viewport) {
        return;
      }

      const list = viewport.firstElementChild;
      if (!list) {
        return;
      }

      viewport.classList.remove('is-ticker');
      const contentHeight = list.scrollHeight;
      const viewportHeight = viewport.clientHeight;
      if (contentHeight <= viewportHeight + 8) {
        return;
      }

      const clone = list.cloneNode(true);
      clone.setAttribute('aria-hidden', 'true');

      const track = document.createElement('div');
      track.className = 'ticker-track';
      track.appendChild(list);
      track.appendChild(clone);

      viewport.textContent = '';
      viewport.appendChild(track);
      viewport.classList.add('is-ticker');

      const speedPxPerSecond = (options && options.speedPxPerSecond) || 32;
      const durationSeconds = Math.max(contentHeight / Math.max(speedPxPerSecond, 1), 8);
      track.style.setProperty('--ticker-duration', durationSeconds + 's');
    }

    function bindCompetitionEvents(scope) {
      scope.querySelectorAll('[data-tab]').forEach(function(button) {
        button.addEventListener('click', function() {
          state.activeCompetitionTab = button.getAttribute('data-tab');
          updateCompetitionModule(true);
        });
      });
    }

    function bindHeroActions(scope) {
      const openButton = scope.querySelector('[data-open-print-modal]');
      if (!openButton || openButton.dataset.bound === 'true') {
        return;
      }

      openButton.dataset.bound = 'true';
      openButton.addEventListener('click', function() {
        state.isPrintModalOpen = true;
        updatePrintModal();
      });
    }

    function bindPrintModalEvents(scope) {
      scope.querySelectorAll('[data-close-print-modal]').forEach(function(button) {
        if (button.dataset.bound === 'true') {
          return;
        }

        button.dataset.bound = 'true';
        button.addEventListener('click', function() {
          state.isPrintModalOpen = false;
          updatePrintModal();
        });
      });

      const printButton = scope.querySelector('[data-trigger-browser-print]');
      if (printButton && printButton.dataset.bound !== 'true') {
        printButton.dataset.bound = 'true';
        printButton.addEventListener('click', function() {
          window.print();
        });
      }
    }

    function pulseMetrics() {
      root.querySelectorAll('.metric-block').forEach(function(node) {
        node.classList.remove('pulse');
        window.requestAnimationFrame(function() {
          node.classList.add('pulse');
        });
      });
    }

    function bindGlobalEvents() {
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape' && state.isPrintModalOpen) {
          state.isPrintModalOpen = false;
          updatePrintModal();
        }
      });

      window.addEventListener('resize', function() {
        const panel = root && root.querySelector ? root.querySelector('[data-panel="tasks"]') : null;
        if (panel) {
          window.requestAnimationFrame(function() {
            fitTasksPanel(panel);
          });
        }
      });
    }

    function formatCurrency(value) {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        maximumFractionDigits: 0,
      }).format(Number(value) || 0);
    }

    function formatPercent(value) {
      const normalized = Number(value) || 0;
      const prefix = normalized > 0 ? '+' : '';
      return prefix + normalized.toFixed(1) + '%';
    }

    function formatLoadingDuration(value) {
      return ((Number(value) || 0) / 1000).toFixed(1) + 's';
    }

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function slugify(value) {
      return String(value == null ? '' : value)
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '') || 'tab';
    }

    boot();
  })();
</script>
